# CI for the FireReach API: architectural guardrails, build, and tests, with
# the results posted as one comment in the pull request's conversation.
#
# The guardrail checker is committed at .github/guardrails/check.mjs and is
# GENERATED from engineering/guardrails/api.md. It is self-contained and
# dependency-free, so it needs no npm install, no Node setup beyond the one
# already on the runner, and no checkout of a second repo. The comment script
# beside it, .github/guardrails/comment.mjs, is generated from
# engineering/tools/comment.mjs the same way and runs on that same Node.
#
# `--from-diff origin/<base>` narrows the mode: diff rules to the lines this
# branch touched. A full-repo run reports six frozen GR-API-009 hits on
# internal/adapter/handler/auth.go, which is documented debt; see
# engineering/README.md.

name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  # The last step posts the results as a comment in the PR conversation.
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Each check saves its output for the PR comment. An explicit `shell: bash`
    # makes GitHub run with `-o pipefail`, so piping through `tee` cannot hide
    # a failure. Checks after a failed one still run (`!cancelled()`), so the
    # comment's table is complete; the job still fails if any check failed.
    defaults:
      run:
        shell: bash
    steps:
      # fetch-depth: 0 is the whole history, which is what `git diff
      # origin/main...HEAD` needs to find a merge base. Do not add a second
      # `git fetch --depth=N` after this: it converts the complete clone back
      # into a shallow one, and a branch whose fork point is older than that
      # window then fails with "fatal: no merge base", exit 128.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check architectural guardrails
        id: guardrails
        env:
          BASE_REF: ${{ github.base_ref }}
        run: >-
          node .github/guardrails/check.mjs --from-diff "origin/$BASE_REF"
          --json "$RUNNER_TEMP/guardrails.json" 2>&1 | tee "$RUNNER_TEMP/guardrails.log"

      - uses: actions/setup-go@v5
        if: ${{ !cancelled() }}
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        id: build
        if: ${{ !cancelled() }}
        run: go build ./... 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Test
        id: tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: go test ./... 2>&1 | tee "$RUNNER_TEMP/tests.log"

      # Posts one comment and edits it on every later push. Pull requests from
      # forks get a read-only token and cannot comment, so this is skipped for
      # them; their results stay in the Checks tab. A failure to post never
      # turns the run red: the comment is a report, not a check.
      - name: Post results to the PR
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GUARDRAILS: ${{ steps.guardrails.outcome }}
          BUILD: ${{ steps.build.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: >-
          node .github/guardrails/comment.mjs
          --guardrails "$GUARDRAILS|$RUNNER_TEMP/guardrails.json|$RUNNER_TEMP/guardrails.log"
          --step "Build|$BUILD|gobuild|$RUNNER_TEMP/build.log"
          --step "Tests|$TESTS|go|$RUNNER_TEMP/tests.log"
